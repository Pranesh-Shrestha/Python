name: pse-memory-profile-5k
on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Number of clean-install passes through the proxy"
        default: "3"

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.dev.invisirisk.com"
          app_token: gotKc4mpd4lBpfNyibx9jE5zd0jupJAcF9tdr1bmP5Hh5X3mXGF4nV54DKqJAMTTljbg2gvlugfOVEpI-Xjgkw
          mode: "docker-intercept"
      # ============= InvisiRisk Setup End =============

      - uses: actions/checkout@v4

      - name: Profile proxy memory during npm installs (~5000 pkgs)
        run: |
          # ---- locate the proxy (owner of port 3128; runs as root) ----
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "profiling Go proxy pid=$PID"
          if ! sudo kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: proxy pid '$PID' not found"
            sudo ss -ltnp 2>/dev/null | grep 3128 || echo "nothing on 3128"
            exit 1
          fi
          sudo awk '/VmRSS/{print "initial RSS:", $2/1024, "MB"}' /proc/$PID/status

          # helper: sum RSS (KB) over all processes whose comm matches a regex
          # uses ps so it covers the whole tree (npm + all node children), not one PID
          echo "PROXY_PID=$PID" > /tmp/profenv

          # ---- background sampler: proxy + npm-tree + node-tree + system mem, every 1s ----
          echo "elapsed_s,proxy_rss_kb,proxy_threads,npm_rss_kb,node_rss_kb,mem_total_kb,mem_available_kb,mem_used_kb" > /tmp/proxy_mem.csv
          ( start=$SECONDS
            for r in $(seq 1 1200); do
              # proxy: single PID (Go = one process, all goroutines inside it)
              ps=$(sudo cat /proc/$PID/status 2>/dev/null)
              prss=$(echo "$ps" | awk '/VmRSS/{print $2}')
              pthr=$(echo "$ps" | awk '/Threads/{print $2}')
              # npm + node: sum RSS across every matching process (the install tree)
              npm_rss=$(ps -eo rss,comm 2>/dev/null  | awk '$2=="npm"{s+=$1} END{print s+0}')
              node_rss=$(ps -eo rss,comm 2>/dev/null | awk '$2=="node"{s+=$1} END{print s+0}')
              # system-wide memory from /proc/meminfo
              mi=$(cat /proc/meminfo)
              mtot=$(echo "$mi" | awk '/^MemTotal:/{print $2}')
              mav=$(echo "$mi"  | awk '/^MemAvailable:/{print $2}')
              mused=$(( mtot - mav ))
              echo "$((SECONDS-start)),${prss:-NA},${pthr:-NA},${npm_rss:-0},${node_rss:-0},${mtot},${mav},${mused}" >> /tmp/proxy_mem.csv
              sleep 1
            done ) &
          SAMPLER=$!

          # ---- workload: large dependency tree (~5000 transitive packages) ----
          mkdir -p /tmp/work && cd /tmp/work
          cat > package.json <<'EOF'
          {
            "name": "proxy-mem-workload-5k", "version": "1.0.0", "private": true,
            "dependencies": {
              "@angular/cli": "^17.3.0",
              "@nestjs/core": "^10.3.0",
              "@nestjs/common": "^10.3.0",
              "@nestjs/platform-express": "^10.3.0",
              "gatsby": "^5.13.0",
              "next": "^14.2.0",
              "nuxt": "^3.11.0",
              "@vue/cli-service": "^5.0.8",
              "react-scripts": "^5.0.1",
              "@storybook/react": "^7.6.0",
              "@storybook/addon-essentials": "^7.6.0",
              "webpack": "^5.91.0",
              "vite": "^5.2.0",
              "rollup": "^4.13.0",
              "parcel": "^2.12.0",
              "typescript": "^5.4.0",
              "eslint": "^8.57.0",
              "prettier": "^3.2.0",
              "jest": "^29.7.0",
              "cypress": "^13.7.0",
              "@playwright/test": "^1.42.0",
              "@babel/core": "^7.24.0",
              "@babel/preset-env": "^7.24.0",
              "@babel/preset-react": "^7.24.0",
              "@babel/preset-typescript": "^7.24.0",
              "@mui/material": "^5.15.0",
              "@mui/icons-material": "^5.15.0",
              "antd": "^5.15.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0",
              "vue": "^3.4.0",
              "@angular/core": "^17.3.0",
              "@angular/common": "^17.3.0",
              "@angular/compiler-cli": "^17.3.0",
              "express": "^4.19.0",
              "lodash": "^4.17.21",
              "rxjs": "^7.8.0",
              "graphql": "^16.8.0",
              "apollo-server": "^3.13.0",
              "@apollo/client": "^3.9.0"
            }
          }
          EOF
          PASSES="${{ inputs.passes }}"
          for p in $(seq 1 "${PASSES:-3}"); do
            echo "=== install pass $p / ${PASSES:-3} ==="
            rm -rf node_modules package-lock.json
            npm cache clean --force >/dev/null 2>&1 || true
            npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tail -3
            COUNT=$(find node_modules -name package.json 2>/dev/null | wc -l)
            sudo awk -v p="$p" -v c="$COUNT" '/VmRSS/{print "  pass "p" end proxy RSS:", $2/1024, "MB  | packages:", c}' /proc/$PID/status
          done
          sleep 4

          # ---- stop sampler & report ----
          kill "$SAMPLER" 2>/dev/null || true
          echo "=== raw samples ==="
          cat /tmp/proxy_mem.csv
          echo "=== summary (all MB) ==="
          awk -F, 'NR>1 && $2!="NA"{
            n++
            if($2>pmax)pmax=$2;                      # proxy peak
            if($3>tmax)tmax=$3;                      # proxy threads peak
            if($4>npmax)npmax=$4;                    # npm tree peak
            if($5>ndmax)ndmax=$5;                    # node tree peak
            if($8>umax)umax=$8;                      # system used peak
            if(amin==""||$7<amin)amin=$7;            # min available
            mtot=$6
          } END {
            if(n==0){print "no samples"; exit}
            printf "samples            = %d\n", n
            printf "PROXY (Go) RSS max = %.1f MB\n", pmax/1024
            printf "  proxy threads max= %d\n", tmax
            printf "npm tree RSS max   = %.1f MB\n", npmax/1024
            printf "node tree RSS max  = %.1f MB\n", ndmax/1024
            printf "----\n"
            printf "system total       = %.1f MB\n", mtot/1024
            printf "system USED max    = %.1f MB   <- peak whole-VM memory in use\n", umax/1024
            printf "system AVAIL min   = %.1f MB   <- closest the VM got to OOM\n", amin/1024
            printf "headroom at worst  = %.1f MB   <- avail min; if near 0 => OOM risk\n", amin/1024
          }' /tmp/proxy_mem.csv

      - name: Upload CSV
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proxy-mem-profile-5k
          path: /tmp/proxy_mem.csv
