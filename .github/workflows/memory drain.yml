name: pse-oom-resilience
on:
  workflow_dispatch:
    inputs:
      kill_method:
        description: "How to kill the proxy"
        type: choice
        default: "sigkill"
        options:
          - "sigkill"        # deterministic SIGKILL (same signal OOM killer uses)
          - "cgroup-oom"     # genuine kernel OOM scoped to the proxy's cgroup

jobs:
  oom-resilience:
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: P9bIYN81piWxyRLubJNGv9c5Oa58SZoUyKS_TFFItNBFvHf0cxmyrENrT2vnUajwbsMswtjU6Cy_pcztRDKmKg
          mode: "docker-intercept"
      # ============= InvisiRisk Setup End =============

      - uses: actions/checkout@v4

      - name: Locate & confirm the proxy
        run: |
          echo "PSE_PID from action      = ${PSE_PID:-<unset>}"
          echo "PSE_BINARY_PATH          = ${PSE_BINARY_PATH:-<unset>}"
          echo "PSE_PROXY_IP             = ${PSE_PROXY_IP:-<unset>}"
          echo "PSE_LOG_FILE             = ${PSE_LOG_FILE:-<unset>}"
          if [ -z "${PSE_PID:-}" ]; then
            echo "PSE_PID not exported by the action — aborting"; exit 1
          fi
          ps -o pid,ppid,rss,comm,args -p "$PSE_PID" || { echo "PSE_PID stale"; exit 1; }

      - name: Baseline — confirm egress is intercepted
        run: |
          curl -s -o /dev/null -w "pre-kill github: %{http_code}\n" https://api.github.com || true
          curl -s -o /dev/null -w "pre-kill npm:    %{http_code}\n" https://registry.npmjs.org || true

      - name: Kill the proxy — SIGKILL
        if: ${{ inputs.kill_method == 'sigkill' }}
        run: |
          echo "SIGKILL on real proxy pid=$PSE_PID (same signal the kernel OOM killer sends)"
          sudo kill -9 "$PSE_PID"
          sleep 5

      - name: Kill the proxy — genuine cgroup OOM
        if: ${{ inputs.kill_method == 'cgroup-oom' }}
        run: |
          # ubuntu-latest is cgroup v2. Scope the OOM to ONLY the proxy so the
          # runner can never be the victim (that's what cancels the job).
          sudo mkdir -p /sys/fs/cgroup/psetest
          echo "$PSE_PID" | sudo tee /sys/fs/cgroup/psetest/cgroup.procs
          echo 0 | sudo tee /sys/fs/cgroup/psetest/memory.swap.max

          RSS_KB=$(awk '/VmRSS/{print $2}' /proc/$PSE_PID/status)
          CAP=$(( (RSS_KB - 4096) * 1024 ))   # cap just under current RSS
          echo "proxy RSS=${RSS_KB}KB -> memory.max=${CAP}"
          echo "$CAP" | sudo tee /sys/fs/cgroup/psetest/memory.max
          sleep 3

          echo "=== cgroup OOM accounting ==="
          grep oom_kill /sys/fs/cgroup/psetest/memory.events || true
          echo "=== kernel log ==="
          sudo dmesg | grep -i -E 'killed process|cgroup out of memory|oom-kill' | tail -10 || true

      - name: Observe reaction
        if: ${{ always() }}
        run: |
          echo "=== did the proxy respawn? ==="
          NEW=$(pgrep -f "${PSE_BINARY_PATH:-pse}" | grep -v "^${PSE_PID}$" || true)
          if [ -n "$NEW" ]; then echo "RESTARTED as pid(s): $NEW"; else echo "STILL DEAD"; fi

          echo "=== proxy-aware egress (honors HTTP_PROXY) ==="
          # refused/hang  -> fail-closed for proxied clients (safe, breaks builds)
          timeout 15 curl -s -o /dev/null -w "proxied npm: %{http_code}\n" https://registry.npmjs.org \
            || echo "proxied egress blocked / refused (FAIL-CLOSED)"

          echo "=== direct egress, bypassing the proxy (fail-open check) ==="
          # success here while proxy is dead -> egress flows UNINTERCEPTED (FAIL-OPEN gap)
          timeout 15 curl -s --noproxy '*' -o /dev/null -w "direct npm: %{http_code}\n" https://registry.npmjs.org \
            || echo "direct egress also blocked"

          echo "=== iptables redirects still pointing at the dead proxy? ==="
          sudo iptables -t nat -L -n -v 2>/dev/null | grep -E "3128|${PSE_PROXY_IP:-NO_IP}" \
            || echo "no nat rules referencing the proxy"

          echo "=== proxy log tail ==="
          tail -40 "${PSE_LOG_FILE:-/tmp/pse_binary.log}" 2>/dev/null || echo "no log at ${PSE_LOG_FILE:-/tmp/pse_binary.log}"
