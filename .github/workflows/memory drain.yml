name: pse-oom-resilience
on:
  workflow_dispatch:
    inputs:
      kill_method:
        description: "How to kill the proxy"
        type: choice
        default: "sigkill"
        options:
          - "sigkill"        # deterministic SIGKILL (same signal the OOM killer uses)
          - "cgroup-oom"     # genuine kernel OOM scoped to the proxy's cgroup

jobs:
  oom-resilience:
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: P9bIYN81piWxyRLubJNGv9c5Oa58SZoUyKS_TFFItNBFvHf0cxmyrENrT2vnUajwbsMswtjU6Cy_pcztRDKmKg
          mode: "docker-intercept"
      # ============= InvisiRisk Setup End =============

      - uses: actions/checkout@v4

      - name: Discover the real proxy
        run: |
          echo "action-reported PSE_PID = ${PSE_PID:-<unset>}"
          echo "PSE_BINARY_PATH         = ${PSE_BINARY_PATH:-<unset>}"
          echo "PSE_PROXY_IP            = ${PSE_PROXY_IP:-<unset>}"

          # 1) PID that owns the proxy port (most authoritative for a host process)
          PORT_PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          # 2) PID matching the binary path
          BIN_PID=$(sudo ps -eo pid,args | grep -F "${PSE_BINARY_PATH:-/nonexistent}" | grep -v grep | awk '{print $1}' | head -1)
          # 3) container running the proxy, if any
          PROXY_CTR=$(docker ps --format '{{.ID}} {{.Image}}' 2>/dev/null | grep -iE 'pse|invisirisk' | awk '{print $1}' | head -1)

          echo "PORT_PID=$PORT_PID  BIN_PID=$BIN_PID  PROXY_CTR=$PROXY_CTR"

          # prefer port owner, then binary match, then the action's PID
          TARGET_PID="${PORT_PID:-${BIN_PID:-$PSE_PID}}"

          echo "TARGET_PID=$TARGET_PID"  >> "$GITHUB_ENV"
          echo "PROXY_CTR=$PROXY_CTR"    >> "$GITHUB_ENV"

          echo "=== diagnostics ==="
          sudo ss -ltnp 2>/dev/null | grep 3128 || echo "nothing on 3128"
          docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' 2>/dev/null || true
          if [ -n "$TARGET_PID" ]; then
            sudo ps -o pid,ppid,rss,args -p "$TARGET_PID" 2>/dev/null || echo "TARGET_PID not a host-visible process"
          fi

          if [ -z "$TARGET_PID" ] && [ -z "$PROXY_CTR" ]; then
            echo "Could not locate the proxy as host process or container."
            echo "It is likely already dead or in a namespace not visible here — check the log:"
            tail -40 "${PSE_LOG_FILE:-/tmp/pse_binary.log}" 2>/dev/null || true
            exit 1
          fi

      - name: Baseline — confirm egress is intercepted
        run: |
          curl -s -o /dev/null -w "pre-kill github: %{http_code}\n" https://api.github.com || true
          curl -s -o /dev/null -w "pre-kill npm:    %{http_code}\n" https://registry.npmjs.org || true

      - name: Kill the proxy — SIGKILL
        if: ${{ inputs.kill_method == 'sigkill' }}
        run: |
          if [ -n "$PROXY_CTR" ]; then
            echo "killing proxy CONTAINER $PROXY_CTR with SIGKILL"
            docker kill --signal=KILL "$PROXY_CTR"
          else
            echo "SIGKILL on proxy pid=$TARGET_PID (same signal the kernel OOM killer sends)"
            sudo kill -9 "$TARGET_PID"
          fi
          sleep 5

      - name: Kill the proxy — genuine cgroup OOM
        if: ${{ inputs.kill_method == 'cgroup-oom' }}
        run: |
          if [ -n "$PROXY_CTR" ]; then
            # Container case: shrink its memory cgroup below current usage -> kernel OOM-kills it.
            USED=$(docker inspect -f '{{.State.Pid}}' "$PROXY_CTR")
            echo "proxy is containerized ($PROXY_CTR); applying a tight memory limit via docker update"
            docker update --memory=16m --memory-swap=16m "$PROXY_CTR" || true
            sleep 3
            docker inspect -f 'oom_killed={{.State.OOMKilled}} running={{.State.Running}}' "$PROXY_CTR"
          else
            # Host process case: cgroup v2, scoped to ONLY the proxy so the runner is never the victim.
            sudo mkdir -p /sys/fs/cgroup/psetest
            echo "$TARGET_PID" | sudo tee /sys/fs/cgroup/psetest/cgroup.procs
            echo 0 | sudo tee /sys/fs/cgroup/psetest/memory.swap.max
            RSS_KB=$(awk '/VmRSS/{print $2}' /proc/$TARGET_PID/status)
            CAP=$(( (RSS_KB - 4096) * 1024 ))
            echo "proxy RSS=${RSS_KB}KB -> memory.max=${CAP}"
            echo "$CAP" | sudo tee /sys/fs/cgroup/psetest/memory.max
            sleep 3
            echo "=== cgroup OOM accounting ==="
            grep oom_kill /sys/fs/cgroup/psetest/memory.events || true
            echo "=== kernel log ==="
            sudo dmesg | grep -i -E 'killed process|cgroup out of memory|oom-kill' | tail -10 || true
          fi

      - name: Observe reaction
        if: ${{ always() }}
        run: |
          echo "=== did the proxy respawn? ==="
          if [ -n "$PROXY_CTR" ]; then
            docker inspect -f 'running={{.State.Running}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' "$PROXY_CTR" 2>/dev/null || echo "container gone"
          fi
          NEW=$(sudo ss -ltnp 2>/dev/null | grep 3128 | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          if [ -n "$NEW" ] && [ "$NEW" != "$TARGET_PID" ]; then
            echo "RESTARTED — new pid on 3128: $NEW"
          elif [ -n "$NEW" ]; then
            echo "still on 3128 as $NEW (kill may not have landed)"
          else
            echo "STILL DEAD — nothing listening on 3128"
          fi

          echo "=== proxy-aware egress (honors HTTP_PROXY) ==="
          # refused/hang -> fail-closed for proxied clients (safe, breaks builds)
          timeout 15 curl -s -o /dev/null -w "proxied npm: %{http_code}\n" https://registry.npmjs.org \
            || echo "proxied egress blocked / refused (FAIL-CLOSED)"

          echo "=== direct egress, bypassing the proxy (fail-open check) ==="
          # success while proxy is dead -> egress flows UNINTERCEPTED (FAIL-OPEN gap)
          timeout 15 curl -s --noproxy '*' -o /dev/null -w "direct npm: %{http_code}\n" https://registry.npmjs.org \
            || echo "direct egress also blocked"

          echo "=== iptables redirects still pointing at the dead proxy? ==="
          sudo iptables -t nat -L -n -v 2>/dev/null | grep -E "3128|${PSE_PROXY_IP:-NO_IP}" \
            || echo "no nat rules referencing the proxy"

          echo "=== proxy log tail ==="
          tail -40 "${PSE_LOG_FILE:-/tmp/pse_binary.log}" 2>/dev/null || echo "no log at ${PSE_LOG_FILE:-/tmp/pse_binary.log}"
