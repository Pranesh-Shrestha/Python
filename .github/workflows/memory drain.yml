name: pse-memory-profile
on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Number of clean-install passes through the proxy"
        default: "3"

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.stage.invisirisk.com"
          app_token: P9bIYN81piWxyRLubJNGv9c5Oa58SZoUyKS_TFFItNBFvHf0cxmyrENrT2vnUajwbsMswtjU6Cy_pcztRDKmKg
          mode: "docker-intercept"
      # ============= InvisiRisk Setup End =============

      - uses: actions/checkout@v4

      - name: Profile proxy memory during npm installs
        run: |
          # ---- locate the proxy (owner of port 3128; runs as root) ----
          PID=$(sudo ss -ltnp 2>/dev/null | awk '/:3128 /{print}' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          PID="${PID:-$PSE_PID}"
          echo "profiling Go proxy pid=$PID"
          if ! sudo kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: proxy pid '$PID' not found"
            sudo ss -ltnp 2>/dev/null | grep 3128 || echo "nothing on 3128"
            exit 1
          fi
          sudo awk '/VmRSS/{print "initial RSS:", $2/1024, "MB"}' /proc/$PID/status

          # ---- background sampler: RSS + thread count (goroutine-leak tell) ----
          # one PID covers ALL goroutines (Go multiplexes them onto threads in-process)
          echo "elapsed_s,rss_kb,vmsize_kb,threads" > /tmp/proxy_mem.csv
          ( start=$SECONDS
            for r in $(seq 1 600); do
              s=$(sudo cat /proc/$PID/status 2>/dev/null) || break
              rss=$(echo "$s" | awk '/VmRSS/{print $2}')
              vsz=$(echo "$s" | awk '/VmSize/{print $2}')
              thr=$(echo "$s" | awk '/Threads/{print $2}')
              echo "$((SECONDS-start)),${rss:-NA},${vsz:-NA},${thr:-NA}" >> /tmp/proxy_mem.csv
              sleep 2
            done ) &
          SAMPLER=$!

          # ---- workload: heavy npm dependency tree ----
          mkdir -p /tmp/work && cd /tmp/work
          cat > package.json <<'EOF'
          {
            "name": "proxy-mem-workload", "version": "1.0.0", "private": true,
            "dependencies": {
              "@angular/cli": "^17.3.0", "webpack": "^5.91.0", "typescript": "^5.4.0",
              "eslint": "^8.57.0", "jest": "^29.7.0", "@babel/core": "^7.24.0",
              "@babel/preset-env": "^7.24.0", "react": "^18.2.0", "react-dom": "^18.2.0",
              "next": "^14.2.0", "vue": "^3.4.0", "express": "^4.19.0",
              "lodash": "^4.17.21", "rxjs": "^7.8.0", "@nestjs/core": "^10.3.0",
              "gatsby": "^5.13.0", "@mui/material": "^5.15.0"
            }
          }
          EOF

          PASSES="${{ inputs.passes }}"
          for p in $(seq 1 "${PASSES:-3}"); do
            echo "=== install pass $p / ${PASSES:-3} ==="
            rm -rf node_modules package-lock.json
            npm cache clean --force >/dev/null 2>&1 || true
            npm install --no-audit --no-fund 2>&1 | tail -3
            # mark RSS at end of each pass
            sudo awk -v p="$p" '/VmRSS/{print "  pass "p" end RSS:", $2/1024, "MB"}' /proc/$PID/status
          done
          sleep 4

          # ---- stop sampler (our own bg loop, NOT the proxy) & report ----
          kill "$SAMPLER" 2>/dev/null || true
          echo "=== raw samples ==="
          cat /tmp/proxy_mem.csv
          echo "=== summary ==="
          awk -F, 'NR>1 && $2!="NA"{
            if($2>maxr)maxr=$2; if(minr==""||$2<minr)minr=$2; sumr+=$2; n++
            if($4>maxt)maxt=$4; if(mint==""||$4<mint)mint=$4
          } END {
            if(n==0){print "no samples captured"; exit}
            printf "samples      = %d\n", n
            printf "RSS min      = %.1f MB\n", minr/1024
            printf "RSS max      = %.1f MB   <- peak the OS backed (use for OOM sizing)\n", maxr/1024
            printf "RSS mean     = %.1f MB\n", (sumr/n)/1024
            printf "RSS growth   = %.1f MB   <- if large & rising across passes => leak\n", (maxr-minr)/1024
            printf "threads min  = %d\n", mint
            printf "threads max  = %d   <- climbing threads + climbing RSS => goroutine leak\n", maxt
          }' /tmp/proxy_mem.csv

      - name: Upload CSV
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: proxy-mem-profile
          path: /tmp/proxy_mem.csv
