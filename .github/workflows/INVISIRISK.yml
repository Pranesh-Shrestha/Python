      - name: Install Git v2.50.0 (VULNERABLE)
        run: |
          # Install build dependencies for Git
          sudo apt-get update
          sudo apt-get install -y make libssl-dev libghc-zlib-dev libcurl4-gnutls-dev libexpat1-dev gettext wget
          
          # Download, compile, and install Git v2.50.0
          wget https://github.com/git/git/archive/refs/tags/v2.50.0.tar.gz -O git.tar.gz
          tar -xzf git.tar.gz
          cd git-2.50.0
          make prefix=/usr/local all
          sudo make prefix=/usr/local install
          

         
